name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE: /monks-three-coffee/
      - name: Render pages
        run: |
          npx vite preview --host 127.0.0.1 --port 8081 --strictPort &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:8081/monks-three-coffee/ && break
            sleep 1
          done
          node scripts/snapshot-pages.mjs
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-dist
          publish_branch: gh-pages
